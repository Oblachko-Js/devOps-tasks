version: "3.9"

services:
  app1:
    build:
      context: .
      args:
        APP_NAME: app1
    image: app1-image
    container_name: app1
    environment:
      - PORT=9001
      - CONFIG_FILE_PATH=conf/application.conf
      - JAVA_OPTS=-Xms512m -Xmx1G
    ports:
      - "9001:9001"

  app2_1:
    build:
      context: .
      args:
        APP_NAME: app2
    image: app2-image-1
    container_name: app2_1
    environment:
      - PORT=9002
      - CONFIG_FILE_PATH=conf/application.conf
      - JAVA_OPTS=-Xms512m -Xmx1G
    ports:
      - "9002:9002"
    depends_on:
      - app1

  app2_2:
    build:
      context: .
      args:
        APP_NAME: app2
    image: app2-image-2
    container_name: app2_2
    environment:
      - PORT=9003
      - CONFIG_FILE_PATH=conf/application.conf
      - JAVA_OPTS=-Xms512m -Xmx1G
    ports:
      - "9003:9003"
    depends_on:
      - app1
